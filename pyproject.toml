[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hardlimit-scout"
version = "0.1.0"
description = "Hardlimit Scout: predict hard AWS limits before they break production."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "ktyby" }]
dependencies = [
  "boto3>=1.34,<2",
  "botocore>=1.34,<2",
  "python-dotenv>=1.0",
  "typer>=0.9",
  "rich>=13",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "cfn-lint>=1.30",
  "pyyaml>=6.0",
]

[project.scripts]
scout = "scout.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
